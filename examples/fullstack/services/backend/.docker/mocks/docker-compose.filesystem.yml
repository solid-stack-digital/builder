services:
  mock-filesystem:
    image: node:22-alpine
    command: "node -e \"\n  const http = require('http');\n  const server = http.createServer((req,\
      \ res) => {\n    res.writeHead(200, { 'Content-Type': 'application/json' });\n\
      \    if (req.url === '/health' || req.url === '/api/info') {\n      res.end(JSON.stringify({\
      \ status: 'healthy', service: 'filesystem', source: 'mock-filesystem' }));\n\
      \    } else if (req.method === 'POST') {\n      res.end(JSON.stringify({ source:\
      \ 'mock-filesystem', status: 'saved', fileId: 'mock-file-123' }));\n    } else\
      \ {\n      res.end(JSON.stringify({ source: 'mock-filesystem', fileId: 'mock-file-123',\
      \ filename: 'mock.txt', content: 'mock content' }));\n    }\n  });\n  server.listen(3003,\
      \ '0.0.0.0', () => console.log('Mock filesystem running on 3003'));\n\"\n"
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('net').connect(3003, '127.0.0.1').on('connect', () => process.exit(0)).on('error',
        () => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 5
