services:
  mock-backend:
    image: node:22-alpine
    command: "node -e \"\n  const http = require('http');\n  const server = http.createServer((req,\
      \ res) => {\n    res.writeHead(200, { 'Content-Type': 'application/json' });\n\
      \    res.end(JSON.stringify({\n      service: 'backend',\n      source: 'mock-backend',\n\
      \      status: 'healthy'\n    }));\n  });\n  server.listen(3002, '0.0.0.0',\
      \ () => console.log('Mock backend running on 3002'));\n\"\n"
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('net').connect(3002, '127.0.0.1').on('connect', () => process.exit(0)).on('error',
        () => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 5
