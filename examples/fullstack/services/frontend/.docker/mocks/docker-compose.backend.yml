services:
  mock-backend:
    image: node:22-alpine
    command: "node -e \"\n  const http = require('http');\n  const server = http.createServer((req,\
      \ res) => {\n    res.writeHead(200, { 'Content-Type': 'application/json' });\n\
      \    if (req.url === '/health' || req.url === '/api/health') {\n      res.end(JSON.stringify({\
      \ status: 'healthy', service: 'backend', source: 'mock-backend' }));\n    }\
      \ else {\n      res.end(JSON.stringify({\n        service: 'backend',\n    \
      \    source: 'mock-backend',\n        database: { status: 'connected', type:\
      \ 'mock' },\n        filesystem: { source: 'mock-filesystem' },\n        mailer:\
      \ { source: 'mock-mailer' }\n      }));\n    }\n  });\n  server.listen(3002,\
      \ '0.0.0.0', () => console.log('Mock backend running on 3002'));\n\"\n"
    healthcheck:
      test:
      - CMD
      - node
      - -e
      - require('net').connect(3002, '127.0.0.1').on('connect', () => process.exit(0)).on('error',
        () => process.exit(1))
      interval: 2s
      timeout: 2s
      retries: 5
